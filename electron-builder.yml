appId: com.northerntech.cfengine-policy-builder
productName: CFEngine Policy Builder
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierrc,.prettierignore}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
  - '!{.env,.env.*,.npmrc}'
  - '!{.github,.git}'
  - '!python'
asarUnpack:
  - resources/**
# The PyInstaller sidecar lands in Contents/Resources/backend (macOS) or
# resources/backend (Windows/Linux), where src/main/backend.ts looks for it.
# Outside the asar on purpose: it is an executable spawned from disk, and
# onedir's layout — the binary next to its _internal/ directory — must survive
# packaging intact. Requires `npm run backend:build` first, which the
# build:mac/win/linux scripts take care of.
extraResources:
  - from: python/dist/cfpb-backend
    to: backend
    filter:
      - '**/*'
# Harden the packaged binary (https://www.electronjs.org/docs/latest/tutorial/security#19-check-which-fuses-you-can-change).
# Flipped after packaging, before signing. The renderer loads from app://bundle
# (src/main/index.ts), so file:// needs none of its extra privileges.
electronFuses:
  runAsNode: false # ignore ELECTRON_RUN_AS_NODE (no Node-mode escape hatch)
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true # enforced on macOS/Windows; no-op on Linux
  grantFileProtocolExtraPrivileges: false
# @todo: wire macOS notarization + Windows EV signing in CI.
mac:
  category: public.app-category.developer-tools
  # Two plists on purpose: the inherit one carries the grants the frozen
  # sidecar needs under hardened runtime (PyInstaller's bootloader sets dyld
  # environment variables and loads unsigned dylibs from _internal/ — without
  # them the child process is killed on launch), while the main binary keeps
  # library validation enabled.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Development
# @todo: publish config for update.electronjs.org auto-updates.
npmRebuild: false
