version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Its own PR: a Playwright bump can break the E2E job on its own. Must stay
      # first, since a dependency joins the first group it matches.
      e2e:
        patterns: ['@playwright/*', 'playwright', 'playwright-core']
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # electron-vite@5 caps vite at ^7; drop when electron-vite@6 is stable
      - dependency-name: vite
        versions: [8.x]
      - dependency-name: '@vitejs/plugin-react'
        versions: [6.x]
      # @northern.tech/eslint-config plugin stack doesn't support eslint 10 yet
      - dependency-name: eslint
        versions: [10.x]
      # ts-api-utils/typescript-eslint don't support the TS 7 native port yet
      - dependency-name: typescript
        versions: [7.x]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
