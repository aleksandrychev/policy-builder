name: CodeQL

# Static analysis of the TypeScript, Python and workflow code with the broader
# security-and-quality queries. Replaces GitHub's CodeQL "default setup", which must be off
# (Settings → Code security), or this workflow's results are rejected.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Interpreted languages: analysed from source, no build step.
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          config: |
            paths-ignore:
              - node_modules
              - out
              - release
              - python/.venv
              - python/build
              - python/dist
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
