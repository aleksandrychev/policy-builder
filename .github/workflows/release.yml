name: Release

# A version tag (v0.1.0, matching package.json) builds the installers for every platform and
# attaches them to a draft prerelease: only people with write access see it until it's published.
# Run by hand, it builds the same installers as workflow artifacts, without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Python sidecar is built for the runner's own architecture: one runner per arch.
          - { name: macOS arm64, runner: macos-15, target: --mac --arm64, arch: arm64, unpacked: mac-arm64/CFEngine Policy Builder.app/Contents/Resources }
          - { name: macOS x64, runner: macos-15-intel, target: --mac --x64, arch: x86_64, unpacked: mac/CFEngine Policy Builder.app/Contents/Resources }
          - { name: Linux x64, runner: ubuntu-latest, target: --linux --x64, unpacked: linux-unpacked/resources }
          - { name: Windows x64, runner: windows-latest, target: --win --x64, unpacked: win-unpacked/resources }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: uv sync --frozen --directory python --group build
      # No signing certificates yet: macOS builds are signed ad hoc (Apple Silicon runs nothing
      # unsigned), which hardened runtime would reject; Windows builds are unsigned.
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mac=()
          if [ "$RUNNER_OS" = macOS ]; then mac=(-c.mac.identity=- -c.mac.hardenedRuntime=false); fi
          npm run package:prepare
          npx electron-builder ${{ matrix.target }} --publish never "${mac[@]}"
      - name: The packaged sidecar runs
        shell: bash
        run: |
          backend="release/${{ matrix.unpacked }}/backend/cfpb-backend"
          [ "$RUNNER_OS" = Windows ] && backend="$backend.exe"
          # Built for the app's architecture (Rosetta would run a wrong one anyway).
          [ "$RUNNER_OS" != macOS ] || file "$backend" | grep -q "${{ matrix.arch }}"
          echo '{"files": []}' | "$backend" compile
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --draft --prerelease --title "$GITHUB_REF_NAME" --generate-notes --notes-file .github/release-notes.md
