name: Commits

# Every commit a pull request adds follows the commit rules:
# signed off by its author (git commit -s), a title of at most 80 characters with no ending
# punctuation, and a blank line before any body.
on:
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    name: Sign-off and titles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/commit-checks.mjs ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
