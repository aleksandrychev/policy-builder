# Two languages, uploaded by separate jobs (.github/workflows/coverage.yml): each flag keeps its
# last result when a commit uploads only the other. The total only informs; a PR's new lines
# must be 80% covered.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: typescript
      paths: [src/]
    - name: python
      paths: [python/]

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: 80%

comment:
  layout: 'condensed_header, flags, files'
