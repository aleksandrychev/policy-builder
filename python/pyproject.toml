[project]
name = "cfpb-backend"
version = "0.1.0"
description = "Python sidecar for CFEngine Policy Builder: formats CFEngine policy via cfengine_cli"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # The whole CFEngine Python toolchain: the `cfengine` distribution installs
  # the `cfengine_cli` package (policy formatting, linting) and pulls in cfbs
  # for policy generation. cf-remote comes along transitively: it deploys
  # policy sets to a hub over SSH (`deploy`).
  "cfengine>=0.20.0",
  # Test environments (cfpb_testenv.py): the official Docker SDK, talking to the Engine socket.
  "docker>=7.1",
]

[project.scripts]
cfpb-backend = "cfpb_backend:main"

[dependency-groups]
dev = [
  "black>=24.10",
  "jsonschema>=4.23",
  "pytest>=8.3",
]
# Only `npm run backend:build` needs PyInstaller (it runs with --group build);
# a plain `uv sync` — including CI's lint/test job — skips it.
build = [
  "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["cfpb_backend.py", "cfpb_build.py", "cfpb_compiler.py", "cfpb_testenv.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Black is the only Python tool here — formatting, no linting.
[tool.black]
line-length = 120
target-version = ["py312"]
# Default is `\.pyi?$`; cfpb-backend.spec is Python we maintain, so format it too.
include = '(\.pyi?|\.spec)$'
