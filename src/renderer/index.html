<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Electron renderer CSP: only allow content from the app itself.
         'unsafe-inline' is required for Emotion/MUI injected styles. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://github.com https://raw.github.com https://*.githubusercontent.com; script-src 'self'"
    />
    <title>CFEngine Policy Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
